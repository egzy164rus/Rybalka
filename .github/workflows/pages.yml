# Публикация игры на GitHub Pages: rybalka.html становится index.html сайта.
# После пуша в main: Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp rybalka.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages изредка падает с «No artifacts named github-pages» — это сбой на стороне
      # сервиса, поэтому пробуем второй раз в том же прогоне
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
